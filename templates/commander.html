<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Passer une Commande</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif;">
        <h2 style="color: #333; text-align: center;">Passer une Commande</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red; font-weight: bold; background-color: #fde8e8; padding: 10px; border-radius: 4px;">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('commander', id_client=id_client) }}" method="POST">
            <label for="product" style="font-weight: bold; display: block; margin-top: 15px;">Choisir un produit :</label>
            <select name="id_produit" id="product" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                {% for produit in produits %}
                    <option value="{{ produit.id }}">
                        {{ produit.nom }} — {{ produit.prix }}€ (Stock disponible: {{ produit.stock }})
                    </option>
                {% endfor %}
            </select>

            <label for="quantite" style="font-weight: bold; display: block; margin-top: 15px;">Quantité souhaitée :</label>
            <input type="number" name="quantite" id="quantite" min="1" value="1" required style="width: 95%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">

            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 25px; border-radius: 4px;">
                Valider la Commande
            </button>
        </form>
        
        <hr style="margin-top: 25px; border: 0; border-top: 1px solid #eee;">
        <p style="text-align: center; margin-top: 15px;"><a href="{{ url_for('client', id_client=id_client) }}" style="color: #007bff; text-decoration: none;">Retour à mon espace client</a></p>
    </div>
</body>
</html>
