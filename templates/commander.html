<!DOCTYPE html>
<html>
<body>
    <h2>Commander</h2>
    <form action="{{ url_for('commander', id_client=id_client) }}" method="POST">
        <select name="id_produit">
            {% for p in produits %}
            <option value="{{ p.id }}">{{ p.nom }}</option>
            {% endfor %}
        </select>
        <input type="number" name="quantite" value="1">
        <button type="submit">Valider</button>
    </form>
</body>
</html>
