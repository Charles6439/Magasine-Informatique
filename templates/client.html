<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 40px;">

    <div style="max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #333;">Espace Client</h2>
            <a href="/" style="background-color: #dc3545; color: white; padding: 8px 15px; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 14px;">Se déconnecter</a>
        </div>

        <div style="margin-bottom: 25px;">
            <a href="{{ url_for('commander', id_client=id_client) }}" style="background-color: #28a745; color: white; padding: 12px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; box-shadow: 0 2px 4px rgba(40,167,69,0.3);">
                🛒 Passer une nouvelle commande
            </a>
        </div>

        <h3 style="color: #555; margin-bottom: 15px;">Mes produits achetés</h3>

        <table border="1" cellpadding="12" style="width: 100%; border-collapse: collapse; border: 1px solid #ddd; text-align: left;">
            <thead>
                <tr style="background-color: #007bff; color: white;">
                    <th>Produit</th>
                    <th>Prix unitaire</th>
                    <th>Quantité</th>
                </tr>
            </thead>
            <tbody>
                {% for p in produits %}
                <tr style="background-color: {% if loop.index0 % 2 == 0 %}#ffffff{% else %}#f9f9f9{% endif %};">
                    <td style="font-weight: bold; color: #333;">{{ p.nom }}</td>
                    <td>{{ p.prix }}€</td>
                    <td style="font-weight: bold; color: #007bff;">{{ p.quantite }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="text-align: center; color: #777; padding: 20px;">Vous n'avez pas encore passé de commande.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>
</html>
